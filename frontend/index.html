<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yosh Junior — Portal Ahli</title>
  <meta name="description" content="Portal ahli Yosh Junior: Database Legality sekolah mengikut cawangan.">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="borang-page lg-page locked" data-tab="legality" data-intro="once-per-visit" data-gate="user">

<div id="intro" class="intro" role="dialog" aria-modal="true" aria-label="Pengenalan">
  <div class="intro-bg" aria-hidden="true">
    <div class="hero-grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
  </div>

  <div class="intro-corners" aria-hidden="true">
    <span class="c-tl">Yosh Junior</span>
    <span class="c-tr">Portal Ahli</span>
    <span class="c-bl">Sistem Pasukan</span>
    <span class="c-br">Sedunia ✦</span>
  </div>

  <div class="intro-stage">
    <div class="intro-glow"></div>
    <div class="intro-logo-wrap" id="introLogoWrap">
      <img class="intro-logo" id="introLogo" src="assets/images/logo.png" alt="Yosh Junior" width="1200" height="462">
      <!-- Shown only if logo.png is missing -->
      <div class="intro-wordmark" aria-hidden="true">yosh<small>Junior</small></div>
    </div>
    <p class="intro-sub"><span class="sub-line"></span>Program Sekolah Sedunia<span class="sub-line"></span></p>
    <div class="intro-action">
      <div class="intro-loader" aria-hidden="true"><span></span></div>
      <button type="button" class="intro-enter" id="introEnter">Masuk <span aria-hidden="true">→</span></button>
    </div>
    <p class="intro-hint">atau tekan Enter</p>
  </div>

  <div class="intro-curtain" aria-hidden="true"></div>
</div>

  <div class="borang-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

  <main class="borang lg">
    <header class="borang-head">
      <img class="borang-logo" src="assets/images/logo.png" alt="Yosh Junior" width="1200" height="462">
      <!-- Portal tabs come from src/components/portalNav.js -->
      <nav class="up-tabs" id="portalTabs" aria-label="Menu"></nav>
      <h1 class="borang-title">Database Legality</h1>
      <nav class="lg-crumbs" id="crumbs" aria-label="Lokasi"></nav>
    </header>

    <div id="root" aria-live="polite">
      <p class="borang-status">Memuatkan…</p>
    </div>
  </main>

  <div class="lg-toast" id="toast" role="status" hidden></div>

  <script src="src/config/config.js"></script>
  <script src="src/services/legalityApi.js"></script>
  <script src="src/components/gate.js"></script>
  <script src="src/components/intro.js"></script>
  <script src="src/components/portalNav.js"></script>
  <script src="src/pages/portal/legality.js"></script>
</body>
</html>
